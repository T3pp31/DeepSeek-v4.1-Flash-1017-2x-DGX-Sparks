[workspace]
resolver = "2"
members = [
    "crates/dsv41-core",
    "crates/dsv41-memguard",
    "crates/dsv41-imgdec",
    "crates/dsv41-ctl",
    "crates/dsv41-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
axum = "0.8"
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive", "env"] }
crc32fast = "1.4"
flate2 = "1.1"
futures-util = "0.3"
getrandom = "0.2"
half = "2.5"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "ico", "pnm"] }
libc = "0.2"
memmap2 = "0.9"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "signal", "sync", "process"] }
url = "2.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
